<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    <!-- figma:head-end -->
    <!-- 规范地址与社交卡片：单域名站点，写死生产 origin（与 App.tsx 里 admin 子域跳转、部署手册一致）。
         放在 figma 标记之外，构建插件不会覆盖。 -->
    <link rel="canonical" href="https://nestspace.online/" />
    <meta property="og:url" content="https://nestspace.online/" />
    <meta property="og:type" content="website" />
    <!-- 浏览器图标：由 scripts/make-brand-logos.py 从同一份原件生成，改标时一起更新。
         favicon 带**圆盘**底（贴着徽章的圆形，不是方块）——纯透明会在浅色或深色标签栏上有一边看不见。 -->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
