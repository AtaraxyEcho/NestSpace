name = "nestspace"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# 静态资产配置（vite 构建产出 ./dist）：
# - binding: 暴露 ASSETS，Worker 才能取到首页 HTML 做 SEO 注入（删掉会导致首页 503！）
# - run_worker_first: /api/* 与管理端首页先进入 Worker 处理（取代 Pages 的 _routes.json）
# - not_found_handling: 未知路径回退 index.html（SPA 哈希路由兜底）
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/", "/index.html"]

# Cloudflare D1 边缘数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "nestspace-prod"
database_id = "5e61e41e-0554-4ec4-8516-ee5f66a5f11d"

# 匿名使用度量（POST /api/usage 写入；事件白名单见 worker 的 USAGE_EVENTS）
# 用 Analytics Engine 而不是新开 D1 表：免费额度内、无需迁移、不存个人数据。
# 查询：npx wrangler analytics query nestspace_usage --since 7d
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "nestspace_usage"
