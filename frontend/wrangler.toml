name = "nestspace"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
# 关掉默认的 workers.dev 端点与 preview URL：不该存在一条绕过自定义域名边缘策略的备用入口。
# （代码层鉴权仍然生效，这是纵深；关掉后只能从绑定的域名访问。）
workers_dev = false
preview_urls = false

# 静态资产配置（vite 构建产出 ./dist）：
# - binding: 暴露 ASSETS，Worker 才能取到首页 HTML 做 SEO 注入（删掉会导致首页 503！）
# - run_worker_first: /api/*、首页与**路径路由的深链**（/project/*、/admin）先进入 Worker 处理
#   （取代 Pages 的 _routes.json）。深链也必须进来，否则拿到的是资产层 SPA 兜底那份**没注入**的 HTML：
#   canonical / og:url / 主题标记全在 Worker 的注入里
# - not_found_handling: 未知路径回退 index.html（SPA 兜底；前端把它们渲染成首页，canonical 回站点根）
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/", "/index.html", "/project/*", "/admin"]

# Cloudflare D1 边缘数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "nestspace-prod"
database_id = "5e61e41e-0554-4ec4-8516-ee5f66a5f11d"

# 每日清理访问台账 90 天前的去重索引（scheduled handler 见 worker/index.ts）。
# 03:17 UTC = 北京时间 11:17，避开低峰与整点任务。
[triggers]
crons = ["17 3 * * *"]

# 匿名使用度量（POST /api/usage；事件白名单见 worker 的 USAGE_EVENTS）。
# 持久落点是 D1 访问台账（迁移 0016）：按天聚合、永久保留，管理端「访问统计」面板读取。
# 页面浏览来自客户端 pageview 事件；访客用浏览器端随机匿名 ID 去重（HMAC 后落库，不存 IP/UA）。
#
# 下面是**可选的第二通道** Analytics Engine：默认保持注释。
# 该绑定要求账号先启用 Analytics Engine，未启用时 wrangler deploy 会直接失败
# （code 10089: You need to enable Analytics Engine），而本地 wrangler dev 是模拟绑定、测不出这个问题。
# 代码侧把它当可选（Env.METRICS? + try/catch），绑定缺失时 AE 写入降级为 no-op，不影响 D1 台账与访客。
# 要额外收一份 AE 数据：在控制台启用 Analytics Engine 后把下面三行加回来再部署：
#   [[analytics_engine_datasets]]
#   binding = "METRICS"
#   dataset = "nestspace_usage"
# 事件集（白名单在 worker 的 USAGE_EVENTS，客户端联合类型由闸门 case 钉住与之同名）：
#   deck         观察台翻页，方式 view/thumb/plate/arrow/drag/key/zoom
#   imgfail      代理取图失败，h=图源主机名
#   dirimport    后台按目录批量导入结果
#   pageview     浏览了哪个页面：home / detail / admin；r=标本编号，v=匿名访客 ID，s=这一段会话的入口来源主机名
#   specimen_open 从哪个位置打开某件标本：card / index / related / footer，r=标本编号
#   outbound     真的出站：github / demo，r=标本编号
#   ⇒ 转化率的算法：outbound ÷ specimen_open（按 r 分组即"哪件作品带走了点击"，按 m 分组即"哪一段在带量"）
# 查询：npx wrangler analytics query nestspace_usage --since 7d
